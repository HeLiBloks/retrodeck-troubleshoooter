[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdtroubleshoot"
version = "0.1.0"
description = "Read-only diagnostics for RetroDECK emulation and scraping on Fedora Atomic"
requires-python = ">=3.11"
# Deliberately empty, and pinned by tests/test_stdlib_only.py. The target machine is
# immutable Fedora Atomic: a runtime dependency there is a distrobox or a vendored copy,
# not a pip install. The tool is also meant to run by file copy, with no install at all.
dependencies = []

[project.scripts]
rdtroubleshoot = "rdtroubleshoot.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
